<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Queue - Pipeline console</title>
<link rel="stylesheet" href="/console.css">
<link rel="stylesheet" href="/queue.css">
</head>
<body class="page-scroll">
<a class="skip" href="#groups">Skip to the queue</a>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <h1>Pipeline</h1>
    <span class="sub">work queue</span>
  </div>
  <nav class="views" aria-label="Console views">
    <a href="/">Lead inbox</a>
    <a href="/queue" aria-current="page">Work Queue</a>
  </nav>
  <span class="spacer"></span>
  <label class="field" for="area">Area</label>
  <select id="area"><option value="">All areas</option></select>
  <button class="btn" id="refresh" type="button">Refresh</button>
</header>

<main class="dash">
  <div class="alert setup" id="setup" role="status" hidden></div>
  <nav class="summary" id="summary" aria-label="Queue sections"></nav>
  <div class="jobbar" id="jobbar" role="status" aria-live="polite" hidden></div>
  <div class="alert" id="joberr" role="alert" hidden></div>
  <div id="groups" aria-live="polite" aria-busy="true" tabindex="-1"></div>
</main>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet preview" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" hidden>
  <div class="sheet-head">
    <h2 id="dlg-title">Details</h2>
    <button class="btn btn-ghost" id="dlg-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="sheet-body" id="dlg-body"></div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/js/queue.js"></script>
</body>
</html>
