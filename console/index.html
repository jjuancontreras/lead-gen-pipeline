<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline console</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<style>
/* ---------------------------------------------------------------------------
   Tokens. One neutral blue-black ramp + a small set of semantic hues, so the
   only saturated colour on screen is carrying meaning (tier, opportunity,
   pipeline stage). Everything else is greyscale and gets out of the way.
   Body text is #e7ecf4 on #0a0c11 (~16:1) because this page is read for long
   stretches; the dimmest text still clears 4.5:1 on its own surface.
--------------------------------------------------------------------------- */
:root{
  --bg:#0a0c11;
  --surface:#10141b;
  --surface-2:#161b24;
  --surface-3:#1d232e;
  --raised:#222a36;
  --line:#242c38;
  --line-soft:#1a2029;
  --text:#e7ecf4;
  --text-2:#b6c1d1;
  --dim:#8b96a8;
  --accent:#4fd1a5;
  --accent-dim:#2b7f66;
  --accent-ink:#03231a;
  --amber:#f0b429;
  --amber-dim:#8a6413;
  --red:#f87171;
  --blue:#7cb0ff;
  --violet:#b39bfa;
  --focus:#7cb0ff;
  --radius:10px;
  --radius-sm:7px;
  --shadow:0 18px 44px rgba(0,0,0,.55);
  --header-h:52px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --dur:.16s;
}
@media (prefers-reduced-motion: reduce){ :root{--dur:0s} }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font:13px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3{margin:0;font-weight:600}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
::selection{background:rgba(79,209,165,.25)}

.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:0 0 8px 0;font-weight:600}
.skip:focus{left:0}

/* ---- scrollbars ---- */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#2b3441;border-radius:99px;border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:#3a4655}

/* ---- shell ---------------------------------------------------------------
   Three stacked bands: identity/actions, pipeline state, then the work.
   The inbox owns every remaining pixel; area definition lives in a sheet.
------------------------------------------------------------------------- */
.app{display:flex;flex-direction:column;height:100vh}

.topbar{
  flex:0 0 auto;height:var(--header-h);display:flex;align-items:center;gap:18px;
  padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mark{width:9px;height:9px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 3px rgba(79,209,165,.15)}
.brand h1{font-size:13.5px;letter-spacing:.01em}
.brand .sub{color:var(--dim);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.stats{display:flex;gap:14px;align-items:baseline;color:var(--dim);font-size:12px;margin-left:4px}
.stats b{color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.topbar-actions{display:flex;gap:8px;align-items:center}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);
  padding:6px 11px;border-radius:var(--radius-sm);font-size:12.5px;
  transition:background var(--dur),border-color var(--dur),color var(--dur);
}
.btn:hover:not(:disabled){background:var(--surface-3);border-color:#33404f;color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-accent:hover:not(:disabled){background:#63e0b6;border-color:#63e0b6;color:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--dim);padding:4px 7px}
.btn-ghost:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.btn-sm{padding:3px 8px;font-size:11.5px}
.btn-danger:hover:not(:disabled){border-color:var(--red);color:var(--red);background:rgba(248,113,113,.08)}

/* run indicator in the top bar, so a campaign stays visible with the sheet shut */
.runchip{
  display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:99px;
  border:1px solid rgba(240,180,41,.4);background:rgba(240,180,41,.09);color:var(--amber);
  font-size:12px;cursor:pointer;
}
.runchip[hidden]{display:none}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.dot.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot.pulse{animation:none}}

/* ---- pipeline strip ---------------------------------------------------- */
.pipeline{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);
}
.pipeline .plabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.stage{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);
  font-size:11.5px;cursor:pointer;white-space:nowrap;
  transition:border-color var(--dur),background var(--dur),color var(--dur);
}
.stage .n{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:600}
.stage:hover{border-color:#3a4655;color:var(--text)}
.stage.empty{opacity:.42}
.stage[aria-pressed="true"]{background:var(--raised);border-color:var(--accent);color:var(--text)}
.stage[aria-pressed="true"] .n{color:var(--accent)}
.stage .tick{width:6px;height:6px;border-radius:50%;background:var(--sc,var(--dim))}
.sep{width:1px;height:16px;background:var(--line);margin:0 3px}

/* ---- toolbar ---- */
.toolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:9px 16px;border-bottom:1px solid var(--line);background:var(--surface);
}
.search{position:relative;flex:0 1 300px;min-width:180px}
.search input{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:6px 28px 6px 30px;color:var(--text);font-size:12.5px;
}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--dim);fill:none;stroke-width:2}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--bg)}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--line);padding:5px 10px;
  font-size:12px;color:var(--dim);cursor:pointer;transition:background var(--dur),color var(--dur)
}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2);color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text);font-weight:600}
.seg button[data-tier="A"][aria-pressed="true"]{color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.seg button[data-tier="B"][aria-pressed="true"]{color:var(--amber);box-shadow:inset 0 -2px var(--amber)}
.seg button[data-tier="C"][aria-pressed="true"]{color:var(--blue);box-shadow:inset 0 -2px var(--blue)}
select{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:6px 8px;font-size:12.5px;color:var(--text-2);cursor:pointer
}
.field{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:11.5px}
.keyhint{color:var(--dim);font-size:11.5px;display:flex;gap:10px;align-items:center}
kbd{
  font:11px var(--mono);background:var(--surface-3);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--text-2)
}

/* ---- workspace ---- */
.workspace{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) 372px;min-height:0}
.tablewrap{min-width:0;overflow:auto;position:relative}

/* ---- table ------------------------------------------------------------- */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{
  position:sticky;top:0;z-index:2;text-align:left;background:var(--surface);
  color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none
}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--text-2)}
thead th .arrow{opacity:0;margin-left:5px;font-size:9px}
thead th[aria-sort] .arrow{opacity:1;color:var(--accent)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr{cursor:pointer;transition:background var(--dur)}
tbody tr:hover{background:var(--surface-2)}
tbody tr[aria-selected="true"]{background:var(--surface-3)}
tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 var(--accent)}
tbody tr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.c-name{max-width:1px;width:38%}
.biz{display:flex;flex-direction:column;gap:1px;min-width:0}
.biz .nm{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.biz .why{
  color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.biz .why.good{color:#83dcbd}
.biz .meta{color:var(--dim);font-size:11.5px}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px;color:var(--text-2)}
.c-contact{max-width:1px;width:20%}
.contact{display:flex;align-items:center;gap:6px;min-width:0}
.contact .ch{
  font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);border-radius:4px;padding:0 4px;flex:0 0 auto
}
.contact .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.none{color:#5c6675}

/* ---- badges ---- */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;
  font-size:11px;border:1px solid var(--line);color:var(--text-2);white-space:nowrap
}
.tier{width:22px;justify-content:center;font-weight:700;font-size:11px;padding:1px 0}
.tier-A{background:rgba(79,209,165,.15);color:#7fe3c1;border-color:rgba(79,209,165,.45)}
.tier-B{background:rgba(240,180,41,.13);color:#f3c65c;border-color:rgba(240,180,41,.42)}
.tier-C{background:rgba(124,176,255,.12);color:var(--blue);border-color:rgba(124,176,255,.35)}
.tier-none{color:#5c6675;border-style:dashed}
.op-prime{background:rgba(79,209,165,.16);color:#8ce8c8;border-color:rgba(79,209,165,.5);font-weight:600}
.op-strong{background:rgba(79,209,165,.08);color:#6fd9b4;border-color:rgba(79,209,165,.3)}
.op-warm{background:rgba(240,180,41,.1);color:#f0c25e;border-color:rgba(240,180,41,.3)}
.op-cold{color:#6b7688;border-color:var(--line)}
.op-unknown{color:#66717f;border-style:dashed}
.st{padding-left:7px}
.st .tick{width:6px;height:6px;border-radius:50%;background:var(--sc)}

/* ---- states ---- */
.state{padding:56px 24px;text-align:center;color:var(--dim);max-width:460px;margin:0 auto}
.state h3{color:var(--text-2);font-size:14px;margin-bottom:6px}
.state p{margin:0 0 14px;font-size:12.5px;line-height:1.6}
.skel{height:11px;border-radius:5px;background:linear-gradient(90deg,#151a22,#1e2531,#151a22);
  background-size:200% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none;background:#1a2029}}

/* ---- detail rail ------------------------------------------------------- */
.detail{
  border-left:1px solid var(--line);background:var(--surface);overflow:auto;min-width:0;
  display:flex;flex-direction:column
}
.detail-head{padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.detail-head .row1{display:flex;align-items:flex-start;gap:10px}
.detail-head h2{font-size:15px;line-height:1.3;flex:1;min-width:0;word-break:break-word}
.detail-head .sub{color:var(--dim);font-size:12px;margin-top:3px}
.detail-body{padding:4px 16px 24px}
.dsec{padding:14px 0;border-bottom:1px solid var(--line-soft)}
.dsec:last-child{border-bottom:0}
.dsec h3{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.reasons{display:flex;flex-direction:column;gap:6px}
.reason{
  display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--line-soft);font-size:12.5px;color:var(--text-2)
}
.reason .g{flex:0 0 auto;width:3px;align-self:stretch;border-radius:2px;background:var(--dim)}
.reason.good{background:rgba(79,209,165,.07);border-color:rgba(79,209,165,.22);color:#bfe9da}
.reason.good .g{background:var(--accent)}
.reason.warn{background:rgba(240,180,41,.06);border-color:rgba(240,180,41,.22);color:#e8d0a0}
.reason.warn .g{background:var(--amber)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:12.5px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;color:var(--text-2);word-break:break-word}
.chan{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.chan:last-child{border-bottom:0}
.chan .ch{width:64px;flex:0 0 auto;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.chan a,.chan span.val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.chan a{color:var(--blue);text-decoration:none}
.chan a:hover{text-decoration:underline}
.meter{height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:99px}

/* ---- ops sheet --------------------------------------------------------- */
.backdrop{position:fixed;inset:0;background:rgba(4,6,10,.6);z-index:40;opacity:0;transition:opacity var(--dur)}
.backdrop.on{opacity:1}
.backdrop[hidden]{display:none}
.sheet{
  position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);z-index:41;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform var(--dur) ease-out
}
.sheet.on{transform:translateX(0)}
.sheet[hidden]{display:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:13px;flex:1}
.sheet-body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:20px}
.block h3{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
#map{height:230px;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:10px;background:var(--surface-2)}
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.inp{
  flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:6px 9px;font-size:12.5px
}
.inp::placeholder{color:var(--dim)}
.inp.bad{border-color:var(--red)}
.hint{font-size:11.5px;color:var(--dim);margin:0}
.hint code{font-family:var(--mono);color:var(--text-2);background:var(--surface-2);padding:0 4px;border-radius:3px}
.alert{
  display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:var(--radius-sm);
  font-size:12.5px;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.08);color:#fca5a5;margin-top:8px
}
.alert[hidden]{display:none}
.alert.ok{border-color:rgba(79,209,165,.35);background:rgba(79,209,165,.08);color:#8ce8c8}
.area{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:7px;background:var(--surface-2)
}
.area .info{flex:1;min-width:0}
.area .info b{display:block;font-weight:600;font-size:12.5px}
.area .info span{display:block;color:var(--dim);font-size:11px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);cursor:pointer}
.switch input{accent-color:var(--accent);width:14px;height:14px}
.logmeta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);margin-bottom:6px}
#log{
  background:#06080c;border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 10px;height:250px;overflow:auto;font:11.5px/1.6 var(--mono);white-space:pre-wrap;
  word-break:break-word;color:#a9b6c6
}
#log .l-stage{color:var(--accent);font-weight:600}
#log .l-err{color:var(--red)}
#log .l-warn{color:var(--amber)}
#log .l-skip{color:var(--dim)}
#log .l-done{color:var(--text);border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
#log .l-idle{color:var(--dim)}

/* ---- toasts ---- */
.toasts{position:fixed;bottom:16px;left:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 13px;font-size:12.5px;box-shadow:var(--shadow);max-width:340px
}
.toast.err{border-color:rgba(248,113,113,.45);color:#fca5a5}
.toast.ok{border-color:rgba(79,209,165,.4);color:#8ce8c8}

/* ---- responsive: laptop first, then narrow ---- */
@media (max-width:1240px){
  .workspace{grid-template-columns:minmax(0,1fr) 320px}
  .keyhint{display:none}
}
@media (max-width:1040px){
  .workspace{grid-template-columns:minmax(0,1fr)}
  .detail{
    position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);z-index:35;
    box-shadow:var(--shadow);transform:translateX(100%);transition:transform var(--dur) ease-out
  }
  .detail.on{transform:translateX(0)}
  .stats{display:none}
}
@media (max-width:820px){
  .c-score,.c-contact{display:none}
  .topbar{gap:10px}
  .brand .sub{display:none}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<a class="skip" href="#leadtable">Skip to lead inbox</a>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>Pipeline</h1>
      <span class="sub">lead console</span>
    </div>
    <div class="stats" id="stats"></div>
    <span class="spacer"></span>
    <div class="topbar-actions">
      <button class="runchip" id="runchip" hidden></button>
      <button class="btn" id="refresh" title="Reload leads and areas (r)">Refresh</button>
      <button class="btn btn-accent" id="openops">Areas &amp; campaigns</button>
    </div>
  </header>

  <nav class="pipeline" id="pipeline" aria-label="Filter by pipeline status"></nav>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Search name, category, reason, contact" aria-label="Search leads">
      <button class="btn btn-ghost btn-sm clear" id="qclear" hidden aria-label="Clear search">&times;</button>
    </div>
    <div class="seg" role="group" aria-label="Filter by tier">
      <button data-tier="A" aria-pressed="false">A</button>
      <button data-tier="B" aria-pressed="false">B</button>
      <button data-tier="C" aria-pressed="false">C</button>
      <button data-tier="-" aria-pressed="false" title="Not yet tiered">untiered</button>
    </div>
    <label class="field">Web presence
      <select id="presence" aria-label="Filter by web presence">
        <option value="">any</option>
        <option value="prime">no site / social only (best)</option>
        <option value="facebook">Facebook only</option>
        <option value="none">no web presence at all</option>
        <option value="warm">weak page (free host, link-in-bio…)</option>
        <option value="cold">has its own site</option>
        <option value="unknown">unverified</option>
      </select>
    </label>
    <label class="field">Sort
      <select id="sort" aria-label="Sort leads">
        <option value="score">score</option>
        <option value="opportunity">opportunity</option>
        <option value="tier">tier</option>
        <option value="status">pipeline stage</option>

    <div class="keyhint">
      <span><kbd>/</kbd> search</span><span><kbd>j</kbd><kbd>k</kbd> move</span><span><kbd>enter</kbd> open</span><span><kbd>esc</kbd> close</span>
    </div>
  </div>

  <div class="workspace">
    <div class="tablewrap" id="tablewrap">
      <table id="leadtable">
        <caption class="sr">Lead inbox</caption>
        <thead><tr id="headrow"></tr></thead>
        <tbody id="leads"></tbody>
      </table>
      <div id="tablestate"></div>

</div>

<div class="backdrop" id="backdrop" hidden></div>

<aside class="sheet" id="ops" hidden role="dialog" aria-modal="true" aria-label="Areas and campaigns">
  <div class="sheet-head">
    <h2>Areas &amp; campaigns</h2>
    <button class="btn btn-ghost" id="closeops" aria-label="Close panel">&times;</button>
  </div>
  <div class="sheet-body">
    <section class="block">
      <h3>Define an area</h3>
      <div id="map"></div>
      <p class="hint" id="bboxout">Draw a rectangle on the map to set the bounding box.</p>
      <div class="form-row" style="margin-top:9px">
        <input class="inp" id="label" placeholder="Label — e.g. Maginhawa, QC" aria-label="Area label">
        <input class="inp" id="key" placeholder="key — e.g. maginhawa" aria-label="Area key" aria-describedby="keyhint">
      </div>
      <p class="hint" id="keyhint">Key must be kebab-case: <code>a-z 0-9 -</code>, starting with a letter or digit.</p>
      <div class="form-row" style="margin-top:9px">
        <button class="btn btn-accent" id="save" disabled>Save area</button>
        <button class="btn" id="cleardraw" disabled>Clear drawing</button>
      </div>
      <div class="alert" id="areaalert" role="alert" hidden></div>
    </section>

    <section class="block">
      <h3>Areas</h3>
      <div id="areas"></div>
    </section>

    <section class="block">
      <h3>Campaign run</h3>
      <div class="runbar">
        <label class="switch"><input type="checkbox" id="dry"> Dry run <span class="hint">(writes nothing)</span></label>
        <span class="spacer"></span>
        <button class="btn btn-sm btn-danger" id="stoprun" hidden>Stop</button>
      </div>
      <div class="logmeta"><span id="runstate">Idle</span><span class="spacer"></span><button class="btn btn-ghost btn-sm" id="clearlog">Clear</button></div>
      <div id="log" tabindex="0" role="log" aria-label="Campaign output"></div>
    </section>
  </div>
</aside>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script>
'use strict';
/* ===========================================================================
   HARD RULE FOR THIS FILE: no value that came from the API is ever handed to
   innerHTML. Lead names, categories and notes are scraped off third-party
   pages, so every one of them goes in through textContent (or an attribute)
   and every container is emptied with replaceChildren(), never `= ''` on
   innerHTML. Static chrome is built with the same DOM helpers so there is no
   innerHTML call anywhere to copy by accident.
=========================================================================== */

const el = (id) => document.getElementById(id);

/** Build an element. `text` always goes through textContent. */
function h(tag, opts, ...kids) {
  const n = document.createElement(tag);
  if (opts) {
    if (opts.class) n.className = opts.class;
    if (opts.text != null) n.textContent = String(opts.text);
    for (const [k, v] of Object.entries(opts.attrs || {})) {
      if (v != null) n.setAttribute(k, String(v));
    }
    if (opts.style) n.setAttribute('style', opts.style);
    if (opts.on) for (const [k, fn] of Object.entries(opts.on)) n.addEventListener(k, fn);
  }
  for (const k of kids) if (k) n.append(k);
  return n;
}

/* ---- vocabulary --------------------------------------------------------- */

/** The pipeline, in order. `group` drives the separators in the strip. */
const STATUSES = [
  { key:'sourced',      label:'Sourced',      group:'intake',   color:'#6b7688', hint:'Pulled from OSM. Not shown in the inbox — qualify them with a campaign run first.' },
  { key:'shortlisted',  label:'Shortlisted',  group:'intake',   color:'#8b96a8', hint:'Passed the SME filter and is worth verifying.' },
  { key:'needs_manual', label:'Needs manual', group:'intake',   color:'#f0b429', hint:'Automated verification could not resolve it. Open it in a browser and decide.' },
  { key:'verified',     label:'Verified',     group:'qualified',color:'#7cb0ff', hint:'Web presence confirmed. Ready for a first touch.' },
  { key:'tier1_sent',   label:'First touch',  group:'outreach', color:'#7cb0ff', hint:'Opening message sent.' },
  { key:'replied',      label:'Replied',      group:'outreach', color:'#4fd1a5', hint:'They answered. Highest priority in the inbox.' },
  { key:'demo_built',   label:'Demo built',   group:'delivery', color:'#b39bfa', hint:'A demo site exists locally.' },
  { key:'demo_sent',    label:'Demo sent',    group:'delivery', color:'#b39bfa', hint:'Demo link is with the prospect.' },
  { key:'meeting',      label:'Meeting',      group:'delivery', color:'#b39bfa', hint:'A call or visit is booked.' },
  { key:'won',          label:'Won',          group:'closed',   color:'#4fd1a5', hint:'Signed.' },
  { key:'lost',         label:'Lost',         group:'closed',   color:'#f87171', hint:'Closed out, no deal.' },
  { key:'nurture',      label:'Nurture',      group:'closed',   color:'#8b96a8', hint:'Parked. Worth another look later.' },
  { key:'disqualified', label:'Disqualified', group:'closed',   color:'#5c6675', hint:'Not an SME fit — never contact.' },
];
const STATUS_BY = Object.fromEntries(STATUSES.map((s, i) => [s.key, { ...s, order: i }]));
const statusMeta = (k) => STATUS_BY[k] || { key:k, label:k || 'unknown', color:'#5c6675', order:99, hint:'' };

/**
 * Web presence, read as an opportunity signal rather than a neutral field.
 * A business whose only reachable presence is a Facebook page already has an
 * audience and nowhere to send it — that is the best possible prospect here,
 * so it ranks above "no presence at all".
 */
const PRESENCE = {
  facebook:     { rank:5, band:'prime',   label:'Facebook only',    say:'Has an audience on Facebook and nowhere to send it. Best possible prospect.' },
  instagram:    { rank:4, band:'strong',  label:'Instagram only',   say:'Runs on Instagram alone — no site to link in bio.' },
  tiktok:       { rank:4, band:'strong',  label:'TikTok only',      say:'TikTok presence only, nothing to convert on.' },
  none:         { rank:4, band:'strong',  label:'No web presence',  say:'Nothing online at all. Whole presence is greenfield.' },
  linktree:     { rank:3, band:'warm',    label:'Link-in-bio only', say:'A link hub standing in for a website.' },
  free_host:    { rank:3, band:'warm',    label:'Free host page',   say:'A free-host page — replaceable with something real.' },
  delivery_app: { rank:2, band:'warm',    label:'Delivery app only',say:'Only reachable through a delivery marketplace, on their terms.' },
  marketplace:  { rank:2, band:'warm',    label:'Marketplace only', say:'Listed on a marketplace, no presence of its own.' },
  standalone:   { rank:0, band:'cold',    label:'Has own site',     say:'Already has a standalone site. Low priority.' },
};
const UNKNOWN_PRESENCE = { rank:1, band:'unknown', label:'Unverified', say:'Verification has not run on this lead yet.' };
const presenceMeta = (k) => PRESENCE[k] || UNKNOWN_PRESENCE;

/** Classify one `notes` fragment so the scoring reason reads as a signal. */
function reasonTone(text) {
  const t = text.toLowerCase();
  if (/no web presence|only presence is|nowhere to send|growing, has budget|phone available|email available/.test(t)) return 'good';
  if (/below sme floor|could not resolve|ambiguous|chain|failed|suppress|do not contact/.test(t)) return 'warn';
  return '';
}
const splitNotes = (notes) =>
  String(notes || '').split(';').map((s) => s.trim()).filter(Boolean);

/* ---- state -------------------------------------------------------------- */

const state = {
  leads: [], counts: {}, total: 0,
  loading: true, error: null,
  q: '', tiers: new Set(), statuses: new Set(), presence: '',
  sort: 'score', dir: -1,
  selected: null,
  view: [],
};

const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };

function bestContact(l) {
  if (l.email) return { ch:'email', v:l.email, href:'mailto:' + encodeURI(l.email) };
  if (l.phone) return { ch:'phone', v:l.phone, href:'tel:' + l.phone.replace(/[^\d+]/g, '') };
  if (l.instagram) return { ch:'ig', v:l.instagram, href:socialUrl('instagram.com', l.instagram) };
  if (l.facebook) return { ch:'fb', v:l.facebook, href:socialUrl('facebook.com', l.facebook) };
  if (l.tiktok) return { ch:'tiktok', v:l.tiktok, href:socialUrl('tiktok.com', l.tiktok) };
  return null;
}

/**
 * Never trust a stored string to be a safe href. Absolute values are allowed
 * only when they are literally http(s); anything else is rebuilt as a path
 * segment on the known social host, so `javascript:` and friends cannot land
 * in an href.
 */
function socialUrl(host, value) {
  const v = String(value || '').trim();
  if (/^https?:\/\//i.test(v)) return v;
  const handle = v.replace(/^@/, '').replace(/^\/+/, '').split(/[?#\s]/)[0];
  if (!handle) return null;
  return 'https://' + host + '/' + encodeURIComponent(handle);
}
const safeHttp = (v) => (/^https?:\/\//i.test(String(v || '').trim()) ? String(v).trim() : null);

/* ---- filtering + sorting ------------------------------------------------ */

function computeView() {
  const q = state.q.trim().toLowerCase();
  let rows = state.leads.filter((l) => {
    if (state.tiers.size) {
      const t = l.tier || '-';
      if (!state.tiers.has(t)) return false;
    }
    if (state.statuses.size && !state.statuses.has(l.status)) return false;
    if (state.presence) {
      const m = presenceMeta(l.website_kind);
      if (state.presence === 'prime') { if (m.band !== 'prime' && m.band !== 'strong') return false; }
      else if (state.presence === 'facebook') { if (l.website_kind !== 'facebook') return false; }
      else if (state.presence === 'none') { if (l.website_kind !== 'none') return false; }
      else if (m.band !== state.presence) return false;
    }
    if (q) {
      const hay = [l.name, l.category, l.notes, l.email, l.phone, l.instagram, l.facebook, l.area, l.status]
        .join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const tierRank = (t) => (t === 'A' ? 3 : t === 'B' ? 2 : t === 'C' ? 1 : 0);
  const keyed = {
    score: (l) => num(l.osm_score),
    opportunity: (l) => presenceMeta(l.website_kind).rank,
    tier: (l) => tierRank(l.tier),
    status: (l) => -statusMeta(l.status).order,
    reviews: (l) => num(l.review_count),
    rating: (l) => num(l.rating),
  };
  const d = state.dir;
  if (state.sort === 'name') {
    // dir 1 = A→Z, dir -1 = Z→A.
    rows = rows.slice().sort((a, b) => String(a.name).localeCompare(String(b.name)) * d);
  } else {
    const f = keyed[state.sort] || keyed.score;
    rows = rows.slice().sort((a, b) => (f(b) - f(a)) * (d === -1 ? 1 : -1) || String(a.name).localeCompare(String(b.name)));
  }
  state.view = rows;
}

/* ---- pipeline strip ----------------------------------------------------- */

function renderPipeline() {
  const nav = el('pipeline');
  const kids = [h('span', { class:'plabel', text:'Pipeline' })];
  let group = null;
  for (const s of STATUSES) {
    if (group && s.group !== group) kids.push(h('span', { class:'sep', attrs:{ 'aria-hidden':'true' } }));
    group = s.group;
    const n = state.counts[s.key] || 0;
    const on = state.statuses.has(s.key);
    const notInInbox = s.key === 'sourced';
    const btn = h('button', {
      class: 'stage' + (n ? '' : ' empty'),
      style: '--sc:' + s.color,
      attrs: {
        type:'button',
        'aria-pressed': on ? 'true' : 'false',
        title: s.hint + (notInInbox ? '' : ''),
      },
      on: { click: () => {
        if (state.statuses.has(s.key)) state.statuses.delete(s.key); else state.statuses.add(s.key);
        refreshUI();
      } },
    },
      h('span', { class:'tick', attrs:{ 'aria-hidden':'true' } }),
      h('span', { text: s.label }),
      h('span', { class:'n', text: n }));
    kids.push(btn);
  }
  nav.replaceChildren(...kids);
}

function renderStats() {
  const shown = state.view.length;
  const inbox = state.leads.length;
  el('stats').replaceChildren(
    h('span', null, h('b', { text: state.total }), document.createTextNode(' in store')),
    h('span', null, h('b', { text: inbox }), document.createTextNode(' in inbox')),
    h('span', null, h('b', { text: shown }), document.createTextNode(' shown')),
  );
  const filtering = state.q || state.tiers.size || state.statuses.size || state.presence;
  el('clearall').hidden = !filtering;
  el('qclear').hidden = !state.q;
}

/* ---- table -------------------------------------------------------------- */

const COLS = [
  { key:'name',        label:'Business',     sort:'name',        class:'c-name' },
  { key:'presence',    label:'Web presence', sort:'opportunity', class:'c-presence' },
  { key:'tier',        label:'Tier',         sort:'tier',        class:'c-tier' },
  { key:'score',       label:'Score',        sort:'score',       class:'c-score' },
  { key:'status',      label:'Stage',        sort:'status',      class:'c-status' },
  { key:'contact',     label:'Contact',      sort:null,          class:'c-contact' },
];

function renderHead() {
  const tr = el('headrow');
  tr.replaceChildren(...COLS.map((c) => {
    const active = c.sort && state.sort === c.sort;
    const th = h('th', {
      class: c.class + (c.sort ? ' sortable' : ''),
      attrs: { scope:'col', tabindex: c.sort ? '0' : null },
    }, h('span', { text: c.label }), h('span', { class:'arrow', text: state.dir === -1 ? '▼' : '▲' }));
    if (active) th.setAttribute('aria-sort', state.dir === -1 ? 'descending' : 'ascending');
    if (c.sort) {
      const go = () => {
        if (state.sort === c.sort) state.dir = -state.dir;
        else { state.sort = c.sort; state.dir = c.sort === 'name' ? 1 : -1; }
        el('sort').value = state.sort;
        refreshUI();
      };
      th.addEventListener('click', go);
      th.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    }
    return th;
  }));
}

function skeletonRows(n) {
  const rows = [];
  for (let i = 0; i < n; i++) {
    const tr = h('tr', { attrs:{ 'aria-hidden':'true' } });
    COLS.forEach((c, j) => {
      tr.append(h('td', { class:c.class },
        h('div', { class:'skel', style:'width:' + (j === 0 ? 55 + (i % 4) * 8 : 40) + '%' })));
    });
    rows.push(tr);
  }
  return rows;
}

function renderTable() {
  const tb = el('leads');
  const stateBox = el('tablestate');

  if (state.loading) {
    tb.replaceChildren(...skeletonRows(10));
    stateBox.replaceChildren();
    return;
  }
  if (state.error) {
    tb.replaceChildren();
    stateBox.replaceChildren(h('div', { class:'state' },
      h('h3', { text:'Could not load leads' }),
      h('p', { text: state.error }),
      h('button', { class:'btn', text:'Try again', on:{ click: loadLeads } })));
    return;
  }
  if (!state.view.length) {
    tb.replaceChildren();
    const onlySourced = state.statuses.size === 1 && state.statuses.has('sourced');
    stateBox.replaceChildren(h('div', { class:'state' },
      h('h3', { text: state.leads.length ? 'Nothing matches these filters' : 'The inbox is empty' }),
      h('p', { text: onlySourced
        ? 'Sourced leads are held back by the API until a campaign qualifies them, so this filter never lists rows. ' +
          (state.counts.sourced || 0) + ' are waiting in the store.'
        : state.leads.length
          ? 'Loosen a filter, or clear them all and start again.'
          : 'Define an area and run a campaign to source leads into it.' }),
      state.leads.length
        ? h('button', { class:'btn', text:'Clear filters', on:{ click: clearFilters } })
        : h('button', { class:'btn btn-accent', text:'Open areas & campaigns', on:{ click: openOps } })));
    return;
  }

  stateBox.replaceChildren();
  const frag = document.createDocumentFragment();
  for (const l of state.view) {
    frag.append(rowFor(l));
  }
  tb.replaceChildren(frag);
}

function rowFor(l) {
  const pm = presenceMeta(l.website_kind);
  const sm = statusMeta(l.status);
  const reasons = splitNotes(l.notes);
  const lead = reasons.find((r) => reasonTone(r) === 'good') || reasons[0] || '';
  const selected = state.selected && state.selected.lead_id === l.lead_id;

  const tr = h('tr', {
    attrs: {
      tabindex:'0',
      'aria-selected': selected ? 'true' : 'false',
      'data-id': l.lead_id,
    },
    on: {
      click: () => select(l),
      keydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(l); } },
    },
  });

  // Business: name, the single strongest reason, then category/area.
  const why = h('div', { class:'why' + (reasonTone(lead) === 'good' ? ' good' : ''), text: lead || (l.category || '') });
  if (lead) why.setAttribute('title', l.notes || '');
  const nameCell = h('td', { class:'c-name' }, h('div', { class:'biz' },
    h('div', { class:'nm', text: l.name || '(unnamed)' }),
    why,
    lead ? h('div', { class:'meta', text: [l.category, l.area].filter(Boolean).join(' · ') }) : null));
  tr.append(nameCell);

  tr.append(h('td', { class:'c-presence' },
    h('span', { class:'badge op-' + pm.band, text: pm.label, attrs:{ title: pm.say } })));

  tr.append(h('td', { class:'c-tier' }, l.tier
    ? h('span', { class:'badge tier tier-' + l.tier, text:l.tier, attrs:{ title:'Tier ' + l.tier } })
    : h('span', { class:'badge tier tier-none', text:'–', attrs:{ title:'Not yet tiered' } })));

  const score = num(l.osm_score);
  tr.append(h('td', { class:'c-score num', text: l.osm_score ? String(score) : '–' }));

  tr.append(h('td', { class:'c-status' },
    h('span', { class:'badge st', style:'--sc:' + sm.color, attrs:{ title: sm.hint } },
      h('span', { class:'tick', attrs:{ 'aria-hidden':'true' } }), h('span', { text: sm.label }))));

  const c = bestContact(l);
  tr.append(h('td', { class:'c-contact' }, c
    ? h('div', { class:'contact' }, h('span', { class:'ch', text:c.ch }), h('span', { class:'v', text:c.v, attrs:{ title:c.v } }))
    : h('span', { class:'none', text:'no channel' })));

  return tr;
}

/* ---- detail rail -------------------------------------------------------- */

function select(l) {
  state.selected = l;
  renderTable();
  renderDetail();
  if (window.matchMedia('(max-width:1040px)').matches) el('detail').classList.add('on');
}

function closeDetail() {
  state.selected = null;
  el('detail').classList.remove('on');
  renderTable();
  renderDetail();
}

function copyBtn(value, what) {
  return h('button', {
    class:'btn btn-ghost btn-sm', text:'copy',
    attrs:{ 'aria-label':'Copy ' + what },
    on:{ click: async (e) => {
      e.stopPropagation();
      try { await navigator.clipboard.writeText(value); toast('Copied ' + what, 'ok'); }
      catch { toast('Clipboard blocked by the browser', 'err'); }
    } },
  });
}

function channelRow(label, value, href) {
  if (!value) return null;
  const row = h('div', { class:'chan' }, h('span', { class:'ch', text: label }));
  if (href) {
    const a = h('a', { text: value, attrs:{ href, rel:'noopener noreferrer', target:'_blank' } });
    row.append(a);
  } else {
    row.append(h('span', { class:'val', text: value }));
  }
  row.append(copyBtn(value, label));
  return row;
}

function renderDetail() {
  const d = el('detail');
  const l = state.selected;
  if (!l) {
    d.replaceChildren(h('div', { class:'state' },
      h('h3', { text:'No lead selected' }),
      h('p', { text:'Pick a row to see why it scored the way it did, plus every contact channel on file.' })));
    return;
  }
  const pm = presenceMeta(l.website_kind);
  const sm = statusMeta(l.status);
  const reasons = splitNotes(l.notes);

  const head = h('div', { class:'detail-head' },
    h('div', { class:'row1' },
      h('h2', { text: l.name || '(unnamed)' }),
      l.tier ? h('span', { class:'badge tier tier-' + l.tier, text:l.tier }) : null,
      h('button', { class:'btn btn-ghost', text:'×', attrs:{ 'aria-label':'Close detail' }, on:{ click: closeDetail } })),
    h('div', { class:'sub', text:[l.category, l.area].filter(Boolean).join(' · ') }),
    h('div', { style:'margin-top:8px;display:flex;gap:6px;flex-wrap:wrap' },
      h('span', { class:'badge st', style:'--sc:' + sm.color },
        h('span', { class:'tick', attrs:{ 'aria-hidden':'true' } }), h('span', { text: sm.label })),
      h('span', { class:'badge op-' + pm.band, text: pm.label })));

  const body = h('div', { class:'detail-body' });

  body.append(h('section', { class:'dsec' },
    h('h3', { text:'Opportunity' }),
    h('p', { class:'hint', style:'font-size:12.5px;color:var(--text-2);margin:0', text: pm.say }),
    h('p', { class:'hint', style:'margin:6px 0 0', text: sm.hint })));

  if (reasons.length) {
    const list = h('div', { class:'reasons' });
    for (const r of reasons) {
      const tone = reasonTone(r);
      list.append(h('div', { class:'reason' + (tone ? ' ' + tone : '') },
        h('span', { class:'g', attrs:{ 'aria-hidden':'true' } }), h('span', { text: r })));
    }
    body.append(h('section', { class:'dsec' }, h('h3', { text:'Why it scored this way' }), list));
  }

  const score = num(l.osm_score);
  const kv = h('dl', { class:'kv' });
  const put = (k, v) => { if (v !== '' && v != null) { kv.append(h('dt', { text:k }), h('dd', { text:String(v) })); } };
  put('OSM score', l.osm_score || '–');
  put('Rating', l.rating || '–');
  put('Reviews', l.review_count || '–');
  put('Branches', l.chain_locations || '–');
  put('Demo', l.demo_slug || '–');
  const signals = h('section', { class:'dsec' }, h('h3', { text:'Signals' }), kv);
  if (l.osm_score) {
    signals.append(h('div', { class:'meter', attrs:{ role:'img', 'aria-label':'OSM score ' + score + ' of 40' } },
      h('i', { style:'width:' + Math.max(3, Math.min(100, (score / 40) * 100)) + '%' })));
  }
  body.append(signals);

  const chans = h('section', { class:'dsec' }, h('h3', { text:'Contact' }));
  const rows = [
    channelRow('email', l.email, l.email ? 'mailto:' + encodeURI(l.email) : null),
    channelRow('phone', l.phone, l.phone ? 'tel:' + l.phone.replace(/[^\d+]/g, '') : null),
    channelRow('instagram', l.instagram, socialUrl('instagram.com', l.instagram)),
    channelRow('facebook', l.facebook, socialUrl('facebook.com', l.facebook)),
  ].filter(Boolean);
  if (rows.length) rows.forEach((r) => chans.append(r));
  else chans.append(h('p', { class:'hint', style:'margin:0', text:'No channel on file yet — this one needs a manual pass.' }));
  body.append(chans);

  d.replaceChildren(head, body);
}

/* ---- data --------------------------------------------------------------- */

function refreshUI() {
  computeView();
  renderPipeline();
  renderHead();
  renderTable();
  renderStats();
}

async function loadLeads() {
  state.loading = true; state.error = null;
  renderTable();
  try {
    const res = await fetch('/api/leads');
    if (!res.ok) throw new Error('server returned ' + res.status);
    const d = await res.json();
    state.leads = Array.isArray(d.leads) ? d.leads : [];
    state.counts = d.counts || {};
    state.total = d.total || state.leads.length;
    state.loading = false;
    if (state.selected) {
      const again = state.leads.find((l) => l.lead_id === state.selected.lead_id);
      state.selected = again || null;
    }
  } catch (err) {
    state.loading = false;
    state.error = err.message || 'network error';
  }
  refreshUI();
  renderDetail();
}

function clearFilters() {
  state.q = ''; el('q').value = '';
  state.tiers.clear(); state.statuses.clear(); state.presence = '';
  el('presence').value = '';
  document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', 'false'));
  refreshUI();
}

/* ---- toasts ------------------------------------------------------------- */

function toast(msg, kind) {
  const t = h('div', { class:'toast' + (kind ? ' ' + kind : ''), text: msg });
  el('toasts').append(t);
  setTimeout(() => t.remove(), 4000);
}

/* ---- map + areas -------------------------------------------------------- */

// Metro Manila. Hand-writing bbox coordinates is error-prone and tedious;
// drawing the rectangle removes that step entirely.
const map = L.map('map', { zoomControl: true }).setView([14.63, 121.06], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const existing = new L.FeatureGroup().addTo(map);  // areas already saved
const drawn = new L.FeatureGroup().addTo(map);     // the rectangle being drawn
map.addControl(new L.Control.Draw({
  edit: { featureGroup: drawn },
  draw: { polyline:false, polygon:false, circle:false, marker:false, circlemarker:false, rectangle:true }
}));

let bbox = null;

function setBboxReadout() {
  const out = el('bboxout');
  if (!bbox) {
    out.textContent = 'Draw a rectangle on the map to set the bounding box.';
  } else {
    out.textContent = 'bbox [S, W, N, E] = ' + bbox.join(', ');
  }
  el('cleardraw').disabled = !bbox;
  syncSaveButton();
}

map.on(L.Draw.Event.CREATED, (e) => {
  drawn.clearLayers();
  drawn.addLayer(e.layer);
  const b = e.layer.getBounds();
  // Overpass order: south, west, north, east.
  bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map((n) => +n.toFixed(5));
  hideAreaAlert();
  setBboxReadout();
});

el('cleardraw').onclick = () => { drawn.clearLayers(); bbox = null; setBboxReadout(); };

const kebab = (s) => s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const KEY_RE = /^[a-z0-9][a-z0-9-]*$/;

// Typing a label offers a key, until the key field is touched by hand.
let keyTouched = false;
el('key').addEventListener('input', () => {
  keyTouched = el('key').value.trim() !== '';
  validateKey();
});
el('label').addEventListener('input', () => {
  if (!keyTouched) el('key').value = kebab(el('label').value.trim()).slice(0, 40);
  validateKey();
});

function validateKey() {
  const v = el('key').value.trim();
  const bad = v !== '' && !KEY_RE.test(v);
  el('key').classList.toggle('bad', bad);
  el('keyhint').textContent = bad
    ? 'Not kebab-case yet. Use a-z, 0-9 and hyphens; start with a letter or digit.'
    : 'Key must be kebab-case: a-z 0-9 -, starting with a letter or digit.';
  syncSaveButton();
}

function syncSaveButton() {
  const v = el('key').value.trim();
  el('save').disabled = !bbox || !KEY_RE.test(v);
}

function showAreaAlert(msg, ok) {
  const a = el('areaalert');
  a.className = 'alert' + (ok ? ' ok' : '');
  a.replaceChildren(h('span', { text: msg }));
  a.hidden = false;
}
function hideAreaAlert() { el('areaalert').hidden = true; }

el('save').onclick = async () => {
  const key = el('key').value.trim().toLowerCase();
  const label = el('label').value.trim();
  if (!bbox || !KEY_RE.test(key)) return;
  const btn = el('save');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await fetch('/api/areas', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ key, label, bbox }),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) {
      // 400 = bad key or bad bbox, 409 = duplicate. Say which, in place.
      const why = res.status === 409 ? 'That key is taken' : 'Rejected';
      showAreaAlert(why + ' (' + res.status + '): ' + (out.error || 'unknown error'), false);
      if (res.status === 409) el('key').focus();
      return;
    }
    el('key').value = ''; el('label').value = ''; keyTouched = false;
    drawn.clearLayers(); bbox = null;
    setBboxReadout(); validateKey();
    showAreaAlert('Saved "' + (out.key || key) + '". Draw another to add more.', true);
    toast('Area saved', 'ok');
    loadAreas();
  } catch (err) {
    showAreaAlert('Network error: ' + (err.message || 'request failed'), false);
  } finally {
    btn.textContent = 'Save area';
    syncSaveButton();
  }
};

function areaSkeleton() {
  const wrap = document.createDocumentFragment();
  for (let i = 0; i < 2; i++) {
    wrap.append(h('div', { class:'area' },
      h('div', { class:'info' }, h('div', { class:'skel', style:'width:45%' }),
        h('div', { class:'skel', style:'width:70%;margin-top:6px' }))));
  }
  return wrap;
}

async function loadAreas() {
  const wrap = el('areas');
  wrap.replaceChildren(areaSkeleton());
  let data;
  try {
    const res = await fetch('/api/areas');
    if (!res.ok) throw new Error('server returned ' + res.status);
    data = await res.json();
  } catch (err) {
    wrap.replaceChildren(h('p', { class:'hint', text:'Could not load areas: ' + (err.message || 'network error') }));
    return;
  }
  const areas = (data && data.areas) || {};
  const keys = Object.keys(areas);
  existing.clearLayers();
  if (!keys.length) {
    wrap.replaceChildren(h('div', { class:'state', style:'padding:22px 8px' },
      h('h3', { text:'No areas yet' }),
      h('p', { text:'Draw a rectangle above, name it, and save it. Campaigns run per area.' })));
    return;
  }
  const frag = document.createDocumentFragment();
  for (const k of keys) {
    const a = areas[k];
    const bb = Array.isArray(a.bbox) ? a.bbox : [];
    if (bb.length === 4) {
      // bbox is [S, W, N, E]; Leaflet wants [[S,W],[N,E]].
      L.rectangle([[bb[0], bb[1]], [bb[2], bb[3]]], {
        color:'#4fd1a5', weight:1, fillOpacity:.06, interactive:false,
      }).addTo(existing);
    }
    frag.append(h('div', { class:'area' },
      h('div', { class:'info' },
        h('b', { text: a.label || k }),
        h('span', { text: k + '  ·  ' + bb.join(', '), attrs:{ title:'[S, W, N, E]' } })),
      bb.length === 4 ? h('button', {
        class:'btn btn-sm', text:'Show',
        attrs:{ title:'Zoom the map to this area' },
        on:{ click: () => map.fitBounds([[bb[0], bb[1]], [bb[2], bb[3]]], { padding:[20, 20] }) },
      }) : null,
      h('button', {
        class:'btn btn-accent btn-sm', text:'Run campaign',
        on:{ click: () => run(k, a.label || k) },
      })));
  }
  wrap.replaceChildren(frag);
}

/* ---- campaign stream ---------------------------------------------------- */

let stream = null, runStart = 0, runTimer = null, logLines = 0;
const MAX_LOG_LINES = 2000;

function logLine(text, cls) {
  const box = el('log');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.append(h('div', { class: cls || '', text }));
  logLines++;
  if (logLines > MAX_LOG_LINES && box.firstChild) { box.removeChild(box.firstChild); logLines--; }
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

/** Classify a raw stdout line so a 40-line run is skimmable. */
function classify(line) {
  const t = line.trim();
  if (/FAILED|Error:|error:|ENOENT|Unknown /.test(t)) return 'l-err';
  if (t.startsWith('>')) return 'l-stage';
  if (t.startsWith('!')) return 'l-warn';
  if (t.startsWith('-')) return 'l-skip';
  return '';
}

function setRunning(on, label) {
  const chip = el('runchip');
  el('stoprun').hidden = !on;
  if (on) {
    chip.hidden = false;
    chip.replaceChildren(h('span', { class:'dot pulse', attrs:{ 'aria-hidden':'true' } }),
      h('span', { text:'Running · ' + label }));
    chip.setAttribute('title', 'Campaign running on ' + label + ' — click to view output');
  } else {
    chip.hidden = true;
  }
}

function tickElapsed(label, note) {
  const secs = Math.round((Date.now() - runStart) / 1000);
  const mm = String(Math.floor(secs / 60)).padStart(2, '0');
  const ss = String(secs % 60).padStart(2, '0');
  el('runstate').textContent = (note || 'Running') + ' · ' + label + ' · ' + mm + ':' + ss;
}

function run(area, label) {
  if (stream) stream.close();
  const dry = el('dry').checked;
  el('log').replaceChildren(); logLines = 0;
  openOps();
  logLine('$ campaign --area ' + area + (dry ? ' --dry-run' : ''), 'l-stage');
  if (dry) logLine('dry run: nothing will be written to the store.', 'l-warn');

  runStart = Date.now();
  tickElapsed(label);
  clearInterval(runTimer);
  runTimer = setInterval(() => tickElapsed(label), 1000);
  setRunning(true, label);

  const q = new URLSearchParams({ area, dryRun: dry ? '1' : '0' });
  stream = new EventSource('/api/campaign?' + q);

  stream.addEventListener('log', (e) => {
    let line;
    try { line = JSON.parse(e.data); } catch { line = String(e.data); }
    logLine(line, classify(line));
  });

  stream.addEventListener('done', (e) => {
    let code = 0;
    try { code = JSON.parse(e.data); } catch { code = e.data; }
    const ok = String(code) === '0';
    logLine('— finished, exit ' + code + ' —', ok ? 'l-done' : 'l-err');
    finishRun(label, ok ? 'Finished' : 'Failed (exit ' + code + ')');
    toast(ok ? 'Campaign finished: ' + label : 'Campaign failed (exit ' + code + ')', ok ? 'ok' : 'err');
    loadLeads();
  });

  stream.onerror = () => {
    // EventSource retries by default; a dead server would loop forever.
    if (!stream) return;
    logLine('stream lost — connection to the console server dropped.', 'l-err');
    finishRun(label, 'Disconnected');
    toast('Campaign stream disconnected', 'err');
  };
}

function finishRun(label, note) {
  if (stream) { stream.close(); stream = null; }
  clearInterval(runTimer); runTimer = null;
  tickElapsed(label, note);
  setRunning(false);
}

el('stoprun').onclick = () => {
  if (!stream) return;
  const label = el('runstate').textContent.split(' · ')[1] || '';
  logLine('stopped by operator.', 'l-warn');
  // Closing the EventSource drops the request; the server kills the child.
  finishRun(label, 'Stopped');
  toast('Campaign stopped', 'ok');
};

el('clearlog').onclick = () => {
  el('log').replaceChildren(h('div', { class:'l-idle', text:'idle.' }));
  logLines = 1;
};

/* ---- ops sheet ---------------------------------------------------------- */

let lastFocus = null;

function openOps() {
  const sheet = el('ops'), back = el('backdrop');
  if (!sheet.hidden) return;
  lastFocus = document.activeElement;
  sheet.hidden = false; back.hidden = false;
  requestAnimationFrame(() => { sheet.classList.add('on'); back.classList.add('on'); });
  sheet.setAttribute('aria-hidden', 'false');
  // Leaflet cannot measure a hidden container.
  setTimeout(() => { map.invalidateSize(); el('closeops').focus(); }, 60);
}

function closeOps() {
  const sheet = el('ops'), back = el('backdrop');
  if (sheet.hidden) return;
  sheet.classList.remove('on'); back.classList.remove('on');
  sheet.setAttribute('aria-hidden', 'true');
  setTimeout(() => { sheet.hidden = true; back.hidden = true; }, 160);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

el('openops').onclick = openOps;
el('closeops').onclick = closeOps;
el('backdrop').onclick = closeOps;
el('runchip').onclick = openOps;
el('refresh').onclick = () => { loadLeads(); loadAreas(); };

// Keep Tab inside the sheet while it is modal.
el('ops').addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const f = el('ops').querySelectorAll('button, input, select, a[href], [tabindex]:not([tabindex="-1"])');
  const list = Array.from(f).filter((n) => n.offsetParent !== null && !n.disabled);
  if (!list.length) return;
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* ---- toolbar wiring ----------------------------------------------------- */

let qTimer = null;
el('q').addEventListener('input', (e) => {
  clearTimeout(qTimer);
  const v = e.target.value;
  qTimer = setTimeout(() => { state.q = v; refreshUI(); }, 110);
});
el('qclear').onclick = () => { el('q').value = ''; state.q = ''; el('q').focus(); refreshUI(); };
el('presence').addEventListener('change', (e) => { state.presence = e.target.value; refreshUI(); });
el('sort').addEventListener('change', (e) => {
  state.sort = e.target.value;
  state.dir = e.target.value === 'name' ? 1 : -1;
  refreshUI();
});
el('clearall').onclick = clearFilters;
document.querySelectorAll('.seg button').forEach((b) => {
  b.addEventListener('click', () => {
    const t = b.dataset.tier;
    const on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', on ? 'false' : 'true');
    if (on) state.tiers.delete(t); else state.tiers.add(t);
    refreshUI();
  });
});

/* ---- keyboard ----------------------------------------------------------- */

function moveSelection(delta) {
  if (!state.view.length) return;
  const i = state.selected ? state.view.findIndex((l) => l.lead_id === state.selected.lead_id) : -1;
  const next = Math.max(0, Math.min(state.view.length - 1, i < 0 ? 0 : i + delta));
  select(state.view[next]);
  const tr = el('leads').querySelector('tr[aria-selected="true"]');
  if (tr) { tr.focus({ preventScroll:true }); tr.scrollIntoView({ block:'nearest' }); }
}

document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === 'Escape') {
    if (!el('ops').hidden) { closeOps(); return; }
    if (typing) { document.activeElement.blur(); return; }
    if (state.selected) { closeDetail(); return; }
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); el('q').focus(); el('q').select(); return; }
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); return; }
  if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1); return; }
  if (e.key === 'r') { e.preventDefault(); loadLeads(); loadAreas(); return; }
  if (e.key === 'a') { e.preventDefault(); openOps(); return; }
});

/* ---- boot --------------------------------------------------------------- */

el('log').replaceChildren(h('div', { class:'l-idle', text:'idle — pick an area and run a campaign.' }));
logLines = 1;
setBboxReadout();
renderDetail();
refreshUI();
loadAreas();
loadLeads();
</script>
</body>
</html>
