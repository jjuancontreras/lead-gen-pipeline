<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline console</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<link rel="stylesheet" href="/console.css">
</head>
<body>
<a class="skip" href="#leadtable">Skip to lead inbox</a>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>Pipeline</h1>
      <span class="sub">lead console</span>
    </div>
    <label class="field" id="areaField">Campaign
      <select id="areaSel" aria-label="Choose campaign area"></select>
    </label>
    <div class="stats" id="stats"></div>
    <span class="spacer"></span>
    <div class="topbar-actions">
      <button class="runchip" id="runchip" hidden></button>
      <button class="btn" id="refresh" title="Reload leads and areas (r)">Refresh</button>
      <button class="btn btn-accent" id="openops">Areas &amp; campaigns</button>
    </div>
  </header>

  <nav class="pipeline" id="pipeline" role="tablist" aria-label="View"></nav>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Search name, category, reason, contact" aria-label="Search leads">
      <button class="btn btn-ghost btn-sm clear" id="qclear" hidden aria-label="Clear search">&times;</button>
    </div>
    <div class="seg" role="group" aria-label="Filter by tier">
      <button data-tier="A" aria-pressed="false">A</button>
      <button data-tier="B" aria-pressed="false">B</button>
      <button data-tier="C" aria-pressed="false">C</button>
      <button data-tier="-" aria-pressed="false" title="Not yet tiered">untiered</button>
    </div>
    <label class="field">Web presence
      <select id="presence" aria-label="Filter by web presence">
        <option value="">any</option>
        <option value="prime">no site / social only (best)</option>
        <option value="facebook">Facebook only</option>
        <option value="none">no web presence at all</option>
        <option value="warm">weak page (free host, link-in-bio…)</option>
        <option value="cold">has its own site</option>
        <option value="unknown">unverified</option>
      </select>
    </label>
    <label class="field">Sort
      <select id="sort" aria-label="Sort leads">
        <option value="score">score</option>
        <option value="opportunity">opportunity</option>
        <option value="tier">tier</option>
        <option value="status">pipeline stage</option>
        <option value="name">name</option>
        <option value="reviews">reviews</option>
        <option value="rating">rating</option>
      </select>
    </label>
    <button class="btn btn-sm" id="clearall" hidden>Clear filters</button>
    <span class="spacer"></span>
    <div class="keyhint">
      <span><kbd>/</kbd> search</span><span><kbd>j</kbd><kbd>k</kbd> move</span><span><kbd>enter</kbd> open</span><span><kbd>esc</kbd> close</span>
    </div>
  </div>

  <div class="workspace">
    <div class="tablewrap" id="tablewrap">
      <table id="leadtable">
        <caption class="sr">Lead inbox</caption>
        <thead><tr id="headrow"></tr></thead>
        <tbody id="leads"></tbody>
      </table>
      <div id="tablestate"></div>
    </div>
    <aside class="detail" id="detail" aria-label="Lead detail"></aside>
  </div>
</div>

<div class="backdrop" id="backdrop" hidden></div>

<aside class="sheet" id="ops" hidden role="dialog" aria-modal="true" aria-label="Areas and campaigns">
  <div class="sheet-head">
    <h2>Areas &amp; campaigns</h2>
    <button class="btn btn-ghost" id="closeops" aria-label="Close panel">&times;</button>
  </div>
  <div class="sheet-body">
    <section class="block">
      <h3>Define an area</h3>
      <div id="map"></div>
      <p class="hint" id="bboxout">Draw a rectangle on the map to set the bounding box.</p>
      <div class="form-row" style="margin-top:9px">
        <input class="inp" id="label" placeholder="Label — e.g. Maginhawa, QC" aria-label="Area label">
        <input class="inp" id="key" placeholder="key — e.g. maginhawa" aria-label="Area key" aria-describedby="keyhint">
      </div>
      <p class="hint" id="keyhint">Key must be kebab-case: <code>a-z 0-9 -</code>, starting with a letter or digit.</p>
      <div class="form-row" style="margin-top:9px">
        <button class="btn btn-accent" id="save" disabled>Save area</button>
        <button class="btn" id="cleardraw" disabled>Clear drawing</button>
      </div>
      <div class="alert" id="areaalert" role="alert" hidden></div>
    </section>

    <section class="block">
      <h3>Areas</h3>
      <div id="areas"></div>
    </section>

    <section class="block">
      <h3>Campaign run</h3>
      <div class="runbar">
        <label class="switch"><input type="checkbox" id="dry"> Dry run <span class="hint">(writes nothing)</span></label>
        <span class="spacer"></span>
        <button class="btn btn-sm btn-danger" id="stoprun" hidden>Stop</button>
      </div>
      <div class="logmeta"><span id="runstate">Idle</span><span class="spacer"></span><button class="btn btn-ghost btn-sm" id="clearlog">Clear</button></div>
      <div id="log" tabindex="0" role="log" aria-label="Campaign output"></div>
    </section>
  </div>
</aside>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
