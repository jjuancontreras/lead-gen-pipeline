<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline console</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<style>
  :root{--bg:#0f1211;--panel:#171b1a;--line:#2a302e;--text:#e8e6e1;--dim:#9aa39f;--brand:#4ade80;--warn:#fbbf24}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.02em}
  .muted{color:var(--dim);font-size:12px}
  main{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 51px)}
  @media(max-width:900px){main{grid-template-columns:1fr;height:auto}}
  section{padding:18px 20px;overflow:auto;border-right:1px solid var(--line)}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:0 0 10px;font-weight:600}
  #map{height:300px;border-radius:10px;border:1px solid var(--line);margin-bottom:12px}
  input,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 11px}
  input:focus{outline:2px solid var(--brand);outline-offset:1px}
  button{cursor:pointer;transition:border-color .15s,color .15s}
  button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--brand);color:#0a0f0c;border-color:var(--brand);font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .area{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:var(--panel)}
  .area b{font-weight:600}
  #log{background:#0a0d0c;border:1px solid var(--line);border-radius:9px;padding:11px;height:230px;overflow:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;color:#c9d1cd}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
  .tierA{color:var(--brand);border-color:var(--brand)}
  .tierB{color:var(--warn);border-color:var(--warn)}
  .counts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .err{color:#f87171}
</style>
</head>
<body>
<header>
  <h1>Pipeline console</h1>
  <span class="muted">draw an area, run a campaign, read the inbox</span>
</header>

<main>
  <section>
    <h2>Define an area</h2>
    <div id="map"></div>
    <div class="row">
      <input id="key" placeholder="key (e.g. maginhawa)" size="18">
      <input id="label" placeholder="Label (e.g. Maginhawa, QC)" size="22">
      <button id="save" disabled>Save drawn area</button>
    </div>
    <p class="muted" id="bboxout">Draw a rectangle on the map to set the bounding box.</p>

    <h2 style="margin-top:22px">Areas</h2>
    <div id="areas"></div>

    <h2 style="margin-top:22px">Run</h2>
    <div class="row">
      <label class="muted"><input type="checkbox" id="dry"> dry run (writes nothing)</label>
    </div>
    <div id="log">idle.</div>
  </section>

  <section style="border-right:none">
    <h2>Lead inbox</h2>
    <div class="counts" id="counts"></div>
    <table>
      <thead><tr><th>Business</th><th>Web presence</th><th>Tier</th><th>Status</th><th>Contact</th></tr></thead>
      <tbody id="leads"></tbody>
    </table>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script>
// Metro Manila. Hand-writing bbox coordinates is error-prone and tedious;
// drawing the rectangle removes that step entirely.
const map = L.map('map').setView([14.63, 121.06], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const drawn = new L.FeatureGroup().addTo(map);
map.addControl(new L.Control.Draw({
  edit: { featureGroup: drawn },
  draw: { polyline: false, polygon: false, circle: false, marker: false, circlemarker: false, rectangle: true }
}));

const el = (id) => document.getElementById(id);
let bbox = null;

map.on(L.Draw.Event.CREATED, (e) => {
  drawn.clearLayers();
  drawn.addLayer(e.layer);
  const b = e.layer.getBounds();
  // Overpass order: south, west, north, east.
  bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map((n) => +n.toFixed(5));
  el('bboxout').textContent = 'bbox [S,W,N,E] = ' + bbox.join(', ');
  el('save').disabled = false;
});

async function loadAreas() {
  const data = await (await fetch('/api/areas')).json();
  const wrap = el('areas');
  wrap.innerHTML = '';
  const keys = Object.keys(data.areas);
  if (!keys.length) { wrap.innerHTML = '<p class="muted">No areas yet.</p>'; return; }
  for (const k of keys) {
    const a = data.areas[k];
    const div = document.createElement('div');
    div.className = 'area';
    const left = document.createElement('div');
    const b = document.createElement('b');
    b.textContent = a.label;
    const sub = document.createElement('span');
    sub.className = 'muted';
    sub.textContent = k + ' - ' + a.bbox.join(', ');
    left.append(b, document.createElement('br'), sub);
    const btn = document.createElement('button');
    btn.className = 'primary';
    btn.textContent = 'Run campaign';
    btn.onclick = () => run(k);
    div.append(left, btn);
    wrap.appendChild(div);
  }
}

el('save').onclick = async () => {
  const key = el('key').value.trim();
  const label = el('label').value.trim();
  if (!key || !bbox) return;
  const res = await fetch('/api/areas', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key, label, bbox })
  });
  const out = await res.json();
  if (!res.ok) {
    el('bboxout').textContent = out.error;
    el('bboxout').className = 'err';
    return;
  }
  el('key').value = '';
  el('label').value = '';
  el('save').disabled = true;
  drawn.clearLayers();
  bbox = null;
  el('bboxout').className = 'muted';
  el('bboxout').textContent = 'Saved. Draw another to add more.';
  loadAreas();
};

let stream = null;
function run(area) {
  if (stream) stream.close();
  const log = el('log');
  log.textContent = '';
  const q = new URLSearchParams({ area, dryRun: el('dry').checked ? '1' : '0' });
  stream = new EventSource('/api/campaign?' + q);
  stream.addEventListener('log', (e) => {
    log.textContent += JSON.parse(e.data) + '\n';
    log.scrollTop = log.scrollHeight;
  });
  stream.addEventListener('done', (e) => {
    log.textContent += '\n--- finished (exit ' + JSON.parse(e.data) + ') ---\n';
    log.scrollTop = log.scrollHeight;
    stream.close();
    stream = null;
    loadLeads();
  });
}

async function loadLeads() {
  const d = await (await fetch('/api/leads')).json();
  const counts = el('counts');
  counts.innerHTML = '';
  for (const [k, v] of Object.entries(d.counts)) {
    const s = document.createElement('span');
    s.className = 'pill';
    s.textContent = k + ' ' + v;
    counts.appendChild(s);
  }
  const tb = el('leads');
  tb.innerHTML = '';
  for (const l of d.leads) {
    const tr = document.createElement('tr');
    const cells = [
      l.name,
      l.website_kind === 'none' ? 'none found' : (l.website_kind || '-'),
      l.tier || '-',
      l.status,
      l.email || l.phone || l.instagram || l.facebook || '-'
    ];
    cells.forEach((text, i) => {
      const td = document.createElement('td');
      if (i === 2 && l.tier) {
        const s = document.createElement('span');
        s.className = 'pill tier' + l.tier;
        s.textContent = l.tier;
        td.appendChild(s);
      } else {
        // textContent, never innerHTML: every one of these is a scraped
        // value from a third-party page and must not be able to inject markup.
        td.textContent = text;
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  }
}

loadAreas();
loadLeads();
</script>
</body>
</html>
